modLoader = "javafml"
loaderVersion = "[47,)"
license = "GPL-3.0-only"

[[mods]]
modId = "datadrivenvillagers"
version = "${version}"
displayName = "DataDrivenVillagers"
authors = "Lion"
logoFile = "assets/datadrivenvillagers/icon.png"
description = '''
Define villager professions in JSON: bind one to a workstation block, give it a texture, and let VillagerTradingPlus handle the trades.

Support: https://www.patreon.com/cw/LithiumPlus
'''

# No [[mixins]] block: Forge reads mixin configs from the jar manifest, which forge/build.gradle
# fills through loom's mixinConfig.

[[dependencies.datadrivenvillagers]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.datadrivenvillagers]]
modId = "minecraft"
# Closed on purpose. The code is bound to APIs that changed in 1.20.2, so an open upper bound would
# only produce crash reports from players on a version this jar was never built for.
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

# Professions work without it, they just have no trades. Load after it so a trade file that names one
# of our professions finds it registered.
[[dependencies.datadrivenvillagers]]
modId = "villagertradingplus"
mandatory = false
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"
