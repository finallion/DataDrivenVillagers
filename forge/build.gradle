plugins {
	id "com.github.johnrengelman.shadow" version "7.1.2"
}

loom {
	accessWidenerPath = project(":common").loom.accessWidenerPath

	forge {
		// Forge has no access wideners. Loom converts ours into a transformer, which is why the
		// widener stays the single place to declare a widened member.
		convertAccessWideners = true
		extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

		// Forge reads mixin configs from the jar manifest, not from mods.toml. Without this line not
		// a single mixin applies, silently.
		mixinConfig "datadrivenvillagers-common.mixins.json"
	}

	runs {
		server {
			runDir "run-server"
		}
	}
}

architectury {
	platformSetupLoomIde()
	forge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentForge.extendsFrom common
}

dependencies {
	forge "net.minecraftforge:forge:${rootProject.forge_version}"

	// Fabric loader and NeoForge ship MixinExtras, Forge does not: the mixins in common use
	// @ModifyExpressionValue and friends, so it travels inside the jar.
	implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixin_extras_version}"))

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

shadowJar {
	exclude "fabric.mod.json"
	exclude "architectury.common.json"

	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set("dev-shadow")
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
	archiveFileName = "${rootProject.mod_id}-${project.name}-mc${rootProject.minecraft_version}-${rootProject.mod_version}.jar"
}

jar {
	archiveClassifier.set("dev")
}

sourcesJar {
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
	duplicatesStrategy 'exclude'
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

publishing {
	publications {
		mavenForge(MavenPublication) {
			artifactId = rootProject.archives_base_name + "-" + project.name
			from components.java
		}
	}

	repositories {
	}
}
