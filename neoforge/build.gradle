plugins {
	id "com.github.johnrengelman.shadow" version "7.1.2"
}

loom {
	accessWidenerPath = project(":common").loom.accessWidenerPath

	neoForge {
		accessTransformer file("src/main/resources/META-INF/accesstransformer.cfg")
	}

	runs {
		server {
			runDir "run-server"
		}
	}
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

shadowJar {
	exclude "fabric.mod.json"
	exclude "architectury.common.json"

	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set("dev-shadow")
	from(rootProject.file("LICENSE"))
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
	archiveFileName = "${rootProject.mod_id}-${project.name}-mc${rootProject.minecraft_version}-${rootProject.mod_version}.jar"
}

jar {
	archiveClassifier.set("dev")
}

sourcesJar {
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
	duplicatesStrategy 'exclude'
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

publishing {
	publications {
		mavenNeoForge(MavenPublication) {
			artifactId = rootProject.archives_base_name + "-" + project.name
			from components.java
		}
	}

	repositories {
	}
}

// Bridges the access widener (yarn) and access transformer (Mojang) through the official names.
tasks.register("checkAccessTransformerParity") {
	group = "verification"
	description = "Fails the build if the access widener and access transformer diverge."
	dependsOn tasks.named("compileJava")

	def awFile = project(":common").file("src/main/resources/datadrivenvillagers.accesswidener")
	def atFile = file("src/main/resources/META-INF/accesstransformer.cfg")
	inputs.file(awFile)
	inputs.file(atFile)

	doLast {
		def mappingConfiguration = net.fabricmc.loom.LoomGradleExtension.get(project).mappingConfiguration
		def tinyFile = mappingConfiguration.tinyMappingsWithMojang
		if (tinyFile == null || !java.nio.file.Files.exists(tinyFile)) {
			throw new GradleException("No Mojang-mapped tiny mappings from Loom; cannot check AW/AT parity.")
		}

		// Every key uses the official namespace: class, member name and descriptor.
		List<String> namespaces = null
		def officialByNamed = [:]
		def officialByMojang = [:]
		def memberByNamed = [:]
		def memberByMojang = [:]
		def currentClass = null

		tinyFile.toFile().eachLine { line ->
			def parts = line.split("\t", -1)
			if (parts[0] == "tiny") {
				namespaces = parts[3..-1]
			} else if (parts[0] == "c") {
				def names = parts[1..-1]
				currentClass = names[0]
				officialByNamed[names[namespaces.indexOf("named")]] = currentClass
				officialByMojang[names[namespaces.indexOf("mojang")]] = currentClass
			} else if (parts[0] == "" && (parts[1] == "f" || parts[1] == "m") && currentClass != null) {
				def kind = parts[1]
				def desc = parts[2]
				def names = parts[3..-1]
				def key = "${kind}:${currentClass}#${names[0]}${kind == 'm' ? desc : ''}"
				memberByNamed["${kind}:${currentClass}#${names[namespaces.indexOf('named')]}${kind == 'm' ? desc : ''}"] = key
				memberByMojang["${kind}:${currentClass}#${names[namespaces.indexOf('mojang')]}${kind == 'm' ? desc : ''}"] = key
			}
		}

		def toOfficial = { String desc, Map classes ->
			desc.replaceAll(/L([^;]+);/) { all, name -> "L${classes[name] ?: name};" }
		}
		def constructorKey = { String owner, String desc -> "m:${owner}#<init>${desc}" }

		def awKeys = [] as Set
		awFile.eachLine { line ->
			line = line.trim()
			if (line.isEmpty() || line.startsWith("#") || line.startsWith("accessWidener")) return
			def tokens = line.split(/\s+/)
			if (tokens[0] != "accessible") {
				throw new GradleException("Parity check supports only 'accessible' entries: ${line}")
			}
			def owner = officialByNamed[tokens[2]]
			if (owner == null) {
				throw new GradleException("Access widener entry not found in mappings: ${line}")
			}
			if (tokens[1] == "class") {
				awKeys << "c:${owner}"
				return
			}
			def kind = tokens[1] == "method" ? "m" : "f"
			def desc = toOfficial(tokens[4], officialByNamed)
			def key = tokens[3] == "<init>" ? constructorKey(owner, desc)
					: memberByNamed["${kind}:${owner}#${tokens[3]}${kind == 'm' ? desc : ''}"]
			if (key == null) {
				throw new GradleException("Access widener entry not found in mappings: ${line}")
			}
			awKeys << key
		}

		def atKeys = [] as Set
		atFile.eachLine { line ->
			line = line.trim()
			if (line.isEmpty() || line.startsWith("#")) return
			def tokens = line.split(/\s+/)
			if (tokens[0] != "public") {
				throw new GradleException("Parity check supports only 'public' entries: ${line}")
			}
			def owner = officialByMojang[tokens[1].replace(".", "/")]
			if (owner == null) {
				throw new GradleException("Access transformer entry not found in mappings: ${line}")
			}
			if (tokens.length == 2) {
				atKeys << "c:${owner}"
				return
			}
			def member = tokens[2]
			def open = member.indexOf("(")
			def key
			if (open < 0) {
				key = memberByMojang["f:${owner}#${member}"]
			} else {
				def name = member.substring(0, open)
				def desc = toOfficial(member.substring(open), officialByMojang)
				key = name == "<init>" ? constructorKey(owner, desc) : memberByMojang["m:${owner}#${name}${desc}"]
			}
			if (key == null) {
				throw new GradleException("Access transformer entry not found in mappings: ${line}")
			}
			atKeys << key
		}

		def onlyInAw = awKeys - atKeys
		def onlyInAt = atKeys - awKeys
		if (!onlyInAw.isEmpty() || !onlyInAt.isEmpty()) {
			throw new GradleException("Access widener and access transformer diverge (official keys). " +
					"Only in access widener: ${onlyInAw}. Only in access transformer: ${onlyInAt}.")
		}
	}
}

tasks.named("check") {
	dependsOn "checkAccessTransformerParity"
}
