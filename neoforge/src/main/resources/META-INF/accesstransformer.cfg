# NeoForge ignores access wideners, and Loom converts datadrivenvillagers.accesswidener into a
# transformer only on old Forge. Same members as the widener, in the Mojang names NeoForge runs on.
# FML reads this path on its own, so nothing declares it in neoforge.mods.toml.
#
# Without this the compiler sees the members widened through the common module while the shipped jar
# keeps them private, and the first access dies with IllegalAccessError during POI registration.

# ProfessionLoader reads the block states of a workstation and writes the state to POI mapping that
# vanilla fills for its own types only.
public net.minecraft.world.entity.ai.village.poi.PoiTypes TYPE_BY_STATE
public net.minecraft.world.entity.ai.village.poi.PoiTypes getBlockStates(Lnet/minecraft/world/level/block/Block;)Ljava/util/Set;

# TypeLoader assigns villager types to biomes through the map vanilla keeps for its own seven.
public net.minecraft.world.entity.npc.VillagerType BY_BIOME

# TypeLoader creates a villager type per file; the pool report counts how often a piece sits in a pool.
public net.minecraft.world.entity.npc.VillagerType <init>(Ljava/lang/String;)V
public net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool templates
public net.minecraft.world.level.levelgen.structure.pools.SinglePoolElement template
