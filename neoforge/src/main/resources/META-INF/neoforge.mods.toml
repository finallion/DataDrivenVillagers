modLoader = "javafml"
# javafml declares [3,]; Forge's old [37,) numbering does not match it and fails to load here.
loaderVersion = "[3,)"
license = "GPL-3.0-only"

[[mods]]
modId = "datadrivenvillagers"
version = "${version}"
displayName = "DataDrivenVillagers"
authors = "Lion"
logoFile = "assets/datadrivenvillagers/icon.png"
description = '''
Define villager professions in JSON. Bind one to a workstation block, give it a texture, and let VillagersTradingPlus handle the trades.

Support: https://www.patreon.com/cw/LithiumPlus
'''

# NeoForge reads mixin configs only from here; Fabric reads them from fabric.mod.json instead.
[[mixins]]
config = "datadrivenvillagers-common.mixins.json"

[[mixins]]
config = "datadrivenvillagers-neoforge.mixins.json"

[[dependencies.datadrivenvillagers]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.datadrivenvillagers]]
modId = "minecraft"
# The upper bound stops at 1.21.2, where APIs this code uses changed.
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

# Optional: professions work without it, only without trades. Loaded after it so it sees our professions.
[[dependencies.datadrivenvillagers]]
modId = "villagertradingplus"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"
